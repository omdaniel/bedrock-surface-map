[package]
name = "bedrock-map"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
surface-cli = { path = "../surface-cli" }
surface-sync = { path = "../surface-sync" }
surface-core.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
axum = "=0.8.8"
tokio = { version = "=1.49.0", features = ["macros", "rt-multi-thread", "net", "signal", "time", "process", "io-util"] }
clap = { version = "4.5", features = ["derive", "env"] }
fs2 = "=0.4.3"
sha2 = "0.10"
toml = "=0.8.23"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "=0.3.34"
tempfile = "3"
bcrypt = "=0.17.1"
getrandom = "=0.4.3"
libc = "=0.2.189"
rpassword = "=7.4.0"
rusqlite = { version = "=0.38.0", features = ["bundled"] }

[dev-dependencies]
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
tower = { version = "=0.5.3", features = ["util"] }
