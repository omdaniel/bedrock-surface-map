[workspace]
members = ["crates/surface-core", "crates/bedrock-adapter", "crates/surface-cli", "crates/surface-gpu", "crates/surface-tracker", "crates/surface-sync"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
surface-core = { path = "crates/surface-core" }
bedrock-adapter = { path = "crates/bedrock-adapter" }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "webgpu"] }
wasm-bindgen = "=0.2.127"

[profile.release]
lto = "thin"

[profile.release.package.surface-gpu]
opt-level = "s"
